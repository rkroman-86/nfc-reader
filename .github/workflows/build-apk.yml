name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME/ANDROID_SDK_ROOT),
      # with licenses accepted — so no setup-android step is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept SDK licenses (safety)
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            echo "===== extracted errors ====="
            grep -nE "^e: |error:|> Task .* FAILED|What went wrong|Caused by:|Could not|> " build.log | head -120
            grep -E "^e: |error:|Could not|Caused by:|What went wrong" build.log | head -40 \
              | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NfcReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NfcReader-apk
          path: NfcReader.apk

      # Publishes the APK as a release so it can be downloaded straight from the phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NFC Reader build ${{ github.run_number }}
          files: NfcReader.apk
